[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rain-corrector-ml"
version = "1.0.0"
description = "Rainfall forecasting, training and inference library for Rain Corrector"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "joblib>=1.4,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "black>=24.10", "mypy>=1.14"]
notebooks = ["jupyterlab>=4.3", "matplotlib>=3.10", "seaborn>=0.13"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rainml*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = "(notebooks|tests)"

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true
